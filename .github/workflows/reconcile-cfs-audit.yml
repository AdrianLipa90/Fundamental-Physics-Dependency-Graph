name: reconcile-cfs-audit

on:
  push:
    branches:
      - fix/refresh-upstream-repository-heads-20260905
    paths:
      - .github/workflows/reconcile-cfs-audit.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refresh-upstream-repository-heads-20260905
          fetch-depth: 0

      - name: Apply exact source-owned CFS reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          graph_path = Path('dependency_graph.yaml')
          claims_path = Path('claims.jsonl')
          graph = graph_path.read_text(encoding='utf-8')
          claims = claims_path.read_text(encoding='utf-8')

          tir_node = '- {claim_id: "TIR.COLLATZ_FS.RELATIONAL_PHASE_INTERFACE", repository: TIR, status: "MATHEMATICAL_INTERFACE_ADDED / PHYSICAL_BINDING_OPEN", source: "TIR/integration/TIR_COLLATZ_FS_RELATIONAL_PHASE_INTERFACE_V0_1.md"}'
          idt_phase_node = '- {claim_id: "IDT.COLLATZ_FS.PHASE_MAP", repository: IDT, status: "EXACT_DISCRETE_PHASE_MAP / CONDITIONAL_ROOT_OF_UNITY_QUANTIZATION_PASS", source: "docs/IDT_COLLATZ_FS_TEMPORAL_PHASE_V0_1.md"}'
          idt_interface_node = '- {claim_id: "IDT.COLLATZ_FS.TEMPORAL_PHASE_INTERFACE", repository: IDT, status: "COMPOSITE_TEMPORAL_STATE_CANDIDATE / PHYSICAL_TIME_COUPLING_OPEN / EINSTEIN_BINDING_OPEN", source: "CURRENT_THEORY_STATE_PHASE_SUPPLEMENT_V0_1.md"}'

          tir_node_anchor = '- {claim_id: "TIR.SPACE.GLOBAL_3MANIFOLD_A5", repository: TIR, status: "EXACT_COMBINATORIAL_MANIFOLD_CERTIFICATE / STANDARD_MOISE_SMOOTHING_BRIDGE / GLOBAL_METRIC_LEVI_CIVITA_GLUE_PASS_ON_CERTIFICATE / ACTUAL_RELATIONAL_COMPLEX_CERTIFICATE_OPEN", source: "TIR/foundations/TIR_GLOBAL_3MANIFOLD_SMOOTH_CERTIFICATE_V0_1.md"}'
          idt_node_anchor = '- {claim_id: "IDT.CLOCK.TEMPORAL_TRACE_UNIQUENESS_V06", repository: IDT, status: "CANDIDATE / EXACT INVARIANT-EXTENSIVE FUNCTIONAL THEOREM", source: "docs/candidates/spacetime_dimension/IDT_TEMPORAL_TRACE_UNIQUENESS_V0_6.md"}'
          tir_edge_anchor = '- {<<: *FR, from: "TIR.SPACE.GLOBAL_3MANIFOLD_A5", to: "TIR.GLOBAL_GLUING"}'
          idt_edge_anchor = '- {<<: *CD, from: "IDT.CLOCK.TEMPORAL_TRACE_LIFT_V02", to: "IDT.CLOCK.TEMPORAL_TRACE_UNIQUENESS_V06", promotion_gate: "IDT_ELAPSED_SCALE_AS_HERMITIAN_TRACE_COORDINATE"}'
          tir_edge = '- {<<: *CAN, from: "TIR.FOUNDATION.C2", to: "TIR.COLLATZ_FS.RELATIONAL_PHASE_INTERFACE"}'
          idt_edge = '- {<<: *CAN, from: "IDT.COLLATZ_FS.PHASE_MAP", to: "IDT.COLLATZ_FS.TEMPORAL_PHASE_INTERFACE"}'

          additions = [tir_node, idt_phase_node, idt_interface_node, tir_edge, idt_edge]
          if any(x in graph for x in additions):
              raise SystemExit('FAIL: one or more CFS canonical additions already present; refusing ambiguous patch')
          for anchor in (tir_node_anchor, idt_node_anchor, tir_edge_anchor, idt_edge_anchor):
              if graph.count(anchor) != 1:
                  raise SystemExit(f'FAIL: expected exactly one graph anchor: {anchor}')

          graph = graph.replace(tir_node_anchor, tir_node_anchor + '\n' + tir_node, 1)
          graph = graph.replace(idt_node_anchor, idt_node_anchor + '\n' + idt_phase_node + '\n' + idt_interface_node, 1)
          graph = graph.replace(tir_edge_anchor, tir_edge_anchor + '\n' + tir_edge, 1)
          graph = graph.replace(idt_edge_anchor, idt_edge_anchor + '\n' + idt_edge, 1)

          tir_claim = '{"claim_id":"TIR.COLLATZ_FS.RELATIONAL_PHASE_INTERFACE","repository":"TIR","status":"MATHEMATICAL_INTERFACE_ADDED / PHYSICAL_BINDING_OPEN","source_path":"TIR/integration/TIR_COLLATZ_FS_RELATIONAL_PHASE_INTERFACE_V0_1.md","evidence_class":"source_formalism_status"}'
          idt_phase_claim = '{"claim_id":"IDT.COLLATZ_FS.PHASE_MAP","repository":"IDT","status":"EXACT_DISCRETE_PHASE_MAP / CONDITIONAL_ROOT_OF_UNITY_QUANTIZATION_PASS","source_path":"docs/IDT_COLLATZ_FS_TEMPORAL_PHASE_V0_1.md","evidence_class":"source_formalism_validation"}'
          idt_interface_claim = '{"claim_id":"IDT.COLLATZ_FS.TEMPORAL_PHASE_INTERFACE","repository":"IDT","status":"COMPOSITE_TEMPORAL_STATE_CANDIDATE / PHYSICAL_TIME_COUPLING_OPEN / EINSTEIN_BINDING_OPEN","source_path":"CURRENT_THEORY_STATE_PHASE_SUPPLEMENT_V0_1.md","evidence_class":"source_formalism_status"}'
          tir_claim_anchor = '{"claim_id":"TIR.SPACE.GLOBAL_3MANIFOLD_A5","repository":"TIR","status":"EXACT_COMBINATORIAL_MANIFOLD_CERTIFICATE / STANDARD_MOISE_SMOOTHING_BRIDGE / GLOBAL_METRIC_LEVI_CIVITA_GLUE_PASS_ON_CERTIFICATE / ACTUAL_RELATIONAL_COMPLEX_CERTIFICATE_OPEN","source_path":"TIR/foundations/TIR_GLOBAL_3MANIFOLD_SMOOTH_CERTIFICATE_V0_1.md","evidence_class":"source_formalism_status"}'
          idt_claim_anchor = '{"claim_id":"IDT.CLOCK.TEMPORAL_TRACE_UNIQUENESS_V06","repository":"IDT","status":"CANDIDATE / EXACT INVARIANT-EXTENSIVE FUNCTIONAL THEOREM","source_path":"docs/candidates/spacetime_dimension/IDT_TEMPORAL_TRACE_UNIQUENESS_V0_6.md","evidence_class":"candidate_formalism"}'

          if any(x in claims for x in (tir_claim, idt_phase_claim, idt_interface_claim)):
              raise SystemExit('FAIL: one or more CFS claim-registry additions already present; refusing ambiguous patch')
          for anchor in (tir_claim_anchor, idt_claim_anchor):
              if claims.count(anchor) != 1:
                  raise SystemExit(f'FAIL: expected exactly one claims anchor: {anchor}')

          claims = claims.replace(tir_claim_anchor, tir_claim_anchor + '\n' + tir_claim, 1)
          claims = claims.replace(idt_claim_anchor, idt_claim_anchor + '\n' + idt_phase_claim + '\n' + idt_interface_claim, 1)

          graph_path.write_text(graph, encoding='utf-8')
          claims_path.write_text(claims, encoding='utf-8')
          PY

      - name: Validate canonical DAG
        run: python tools/validate_dag.py

      - name: Commit reconciliation to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dependency_graph.yaml claims.jsonl
          git diff --cached --check
          git commit -m "Reconcile TIR and IDT Collatz-FS source exports"
          git push origin HEAD:fix/refresh-upstream-repository-heads-20260905

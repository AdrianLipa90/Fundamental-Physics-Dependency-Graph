name: Candidate 600-cell dependency overlay v0.2

on:
  push:
    branches:
      - candidate/600cell-working-layer-v0.1-20260911
  workflow_dispatch:

jobs:
  validate-candidate-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate active candidate dependency overlay
        run: python candidate/validate_600cell_working_layer_v0_2.py

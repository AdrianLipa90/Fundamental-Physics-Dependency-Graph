name: Validate relational phase observation staging

on:
  pull_request:
    paths:
      - 'bridges/RELATIONAL_PHASE_OBSERVATION_BRIDGE_V0_1.yaml'
      - 'bridges/PROJECT_REPOSITORY_HYPERLINK_MATRIX_V0_1.md'
      - 'tools/validate_relational_phase_observation_bridge.py'
      - 'tests/test_relational_phase_observation_bridge.py'
      - '.github/workflows/relational-phase-observation-staging.yml'
  workflow_dispatch:

jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install pyyaml pytest
      - name: Validate staging manifest
        run: python tools/validate_relational_phase_observation_bridge.py
      - name: Run staging tests
        run: python -m pytest -q tests/test_relational_phase_observation_bridge.py

name: Watch Fundamental Source Drift

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'source_exports.lock.json'
      - 'claims.jsonl'
      - 'dependency_graph.yaml'
      - 'interfaces/cross_repo_interfaces.yaml'
      - 'diagnostics/incidents/**'
      - 'schemas/diagnostic_probe_plan.schema.json'
      - 'tools/watch_source_drift.py'
      - 'tools/diagnose_source_drift.py'
      - 'tools/diff_dependency_export.py'
      - 'tools/diagnose_inconsistency.py'
      - 'tools/localize_interface_seams.py'
      - 'tools/localize_micro_coordinates.py'
      - 'tools/enrich_gremlin_pain_packet_with_micro.py'
      - 'tools/build_diagnostic_probe_plan.py'
      - 'tools/finalize_inconsistency_localization.py'
      - 'tools/build_pain_signature.py'
      - 'tools/match_pain_signatures.py'
      - 'tools/build_gremlin_pain_packet.py'
      - 'tests/test_source_drift.py'
      - 'tests/test_diagnose_inconsistency.py'
      - 'tests/test_dependency_export_diff.py'
      - 'tests/test_localize_interface_seams.py'
      - 'tests/test_micro_localization.py'
      - 'tests/test_enrich_gremlin_micro.py'
      - 'tests/test_diagnostic_probe_plan.py'
      - 'tests/test_pain_signatures.py'
      - '.github/workflows/watch-source-drift.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'source_exports.lock.json'
      - 'claims.jsonl'
      - 'dependency_graph.yaml'
      - 'interfaces/cross_repo_interfaces.yaml'
      - 'diagnostics/incidents/**'
      - 'schemas/diagnostic_probe_plan.schema.json'
      - 'tools/watch_source_drift.py'
      - 'tools/diagnose_source_drift.py'
      - 'tools/diff_dependency_export.py'
      - 'tools/diagnose_inconsistency.py'
      - 'tools/localize_interface_seams.py'
      - 'tools/localize_micro_coordinates.py'
      - 'tools/enrich_gremlin_pain_packet_with_micro.py'
      - 'tools/build_diagnostic_probe_plan.py'
      - 'tools/finalize_inconsistency_localization.py'
      - 'tools/build_pain_signature.py'
      - 'tools/match_pain_signatures.py'
      - 'tools/build_gremlin_pain_packet.py'
      - 'tests/test_source_drift.py'
      - 'tests/test_diagnose_inconsistency.py'
      - 'tests/test_dependency_export_diff.py'
      - 'tests/test_localize_interface_seams.py'
      - 'tests/test_micro_localization.py'
      - 'tests/test_enrich_gremlin_micro.py'
      - 'tests/test_diagnostic_probe_plan.py'
      - 'tests/test_pain_signatures.py'
      - '.github/workflows/watch-source-drift.yml'

permissions:
  contents: read

jobs:
  source-drift-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compute source drift and provisional promoted blast radius
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/watch_source_drift.py --fail-on-drift --json
      - name: Localize claim/interface inconsistency and prepare GREMLIN packet
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/diagnose_source_drift.py --json
      - name: Finalize exact sub-claim coordinates and probe order
        if: always()
        run: python tools/finalize_inconsistency_localization.py
      - name: Publish drift and diagnosis to job summary
        if: always()
        run: |
          if [ -f build/SOURCE_DRIFT_REPORT.md ]; then
            cat build/SOURCE_DRIFT_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/INCONSISTENCY_DIAGNOSIS.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat build/INCONSISTENCY_DIAGNOSIS.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/PAIN_SEAM_REPORT.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat build/PAIN_SEAM_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/PAIN_MICRO_COORDINATES.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat build/PAIN_MICRO_COORDINATES.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/DIAGNOSTIC_PROBE_PLAN.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat build/DIAGNOSTIC_PROBE_PLAN.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload drift and localization receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpdg-source-drift-report
          path: |
            build/SOURCE_DRIFT_REPORT.json
            build/SOURCE_DRIFT_REPORT.md
            build/DEPENDENCY_EXPORT_SEMANTIC_DIFF.json
            build/INCONSISTENCY_EVIDENCE.json
            build/INCONSISTENCY_DIAGNOSIS.json
            build/INCONSISTENCY_DIAGNOSIS.md
            build/PAIN_SEAM_REPORT.json
            build/PAIN_SEAM_REPORT.md
            build/PAIN_MICRO_COORDINATES.json
            build/PAIN_MICRO_COORDINATES.md
            build/DIAGNOSTIC_PROBE_PLAN.json
            build/DIAGNOSTIC_PROBE_PLAN.md
            build/PAIN_SIGNATURE.json
            build/PAIN_SIGNATURE_MATCHES.json
            build/GREMLIN_PAIN_PACKET.json
          if-no-files-found: warn

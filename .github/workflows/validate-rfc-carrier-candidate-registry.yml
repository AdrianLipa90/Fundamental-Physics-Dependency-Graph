name: Validate RFC Carrier Candidate Registry

on:
  pull_request:
    paths:
      - 'diagnostics/RFC_CARRIER_CANDIDATE_REGISTRY_V0_1.*'
      - 'tools/validate_rfc_carrier_candidate_registry_v0_1.py'
      - '.github/workflows/validate-rfc-carrier-candidate-registry.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate carrier-selection firewall
        run: python tools/validate_rfc_carrier_candidate_registry_v0_1.py

name: Validate Locked Source Exports

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  source-export-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Check all registered upstream source heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_upstream_heads.py
      - name: Fetch exact locked exports
        run: python tools/fetch_locked_exports.py --out .source_exports
      - name: Reconcile all registered source-local surfaces
        run: python tools/import_exports.py --require-all --summary-json .source_exports/*.json

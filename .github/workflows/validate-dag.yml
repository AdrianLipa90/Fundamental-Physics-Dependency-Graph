name: Validate Fundamental Dependency DAG

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate canonical DAG
        run: python tools/validate_dag.py

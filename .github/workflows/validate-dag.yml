name: Validate Fundamental Dependency DAG

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate canonical DAG
        run: python tools/validate_dag.py
      - name: Validate dependency export schema JSON
        run: python -m json.tool schemas/dependency_export.schema.json > /dev/null
      - name: Validate inconsistency evidence schema JSON
        run: python -m json.tool schemas/inconsistency_evidence.schema.json > /dev/null
      - name: Validate pain seam report schema JSON
        run: python -m json.tool schemas/pain_seam_report.schema.json > /dev/null
      - name: Validate GREMLIN pain packet schema JSON
        run: python -m json.tool schemas/gremlin_pain_packet.schema.json > /dev/null
      - name: Test dependency, drift, seam, and pain-localization invariants
        run: python -m unittest discover -s tests -v
      - name: Validate four-source dependency export roundtrip
        run: python tools/export_roundtrip.py

    to: IDT
    relation: Xi_I_to_U_I_to_condensate_force
    status: CANDIDATE_ONLY
    promotion_gate: PHYSICAL_CI_CALIBRATION_AND_CARRIER_BINDING
  - from: GREMLIN
    to: IDT
    relation: tau_to_effective_winding_to_shell_radius
    status: CANDIDATE_ONLY
    promotion_gate: PHYSICAL_TAU_TO_CONDENSATE_CONNECTION_BINDING
  - from: RC
    to: OES
    relation: graph_loop_phase_to_spectral_response
    status: MATHEMATICAL_INTERFACE
    promotion_gate: EXPERIMENTAL_OR_CONTROLLED_MODEL_BINDING
  - from: IDT
    to: QHTRI_OPTICS
    relation: orbital_epicyclic_observables_to_scalar_phase_curvature
    status: MATHEMATICAL_INTERFACE
    promotion_gate: SHARED_SCALAR_CARRIER_DECLARATION
  - from: QHTRI_OPTICS
    to: RFC
    relation: scalar_phase_curvature_to_spacetime_metric
    status: OPEN_NOT_PROMOTED
    promotion_gate: H_G_METRIC_BRIDGE


theorems:
  CENTRAL_ORBITAL_INVERSE:
    status: EXACT_WITHIN_STATIONARY_CENTRAL_SCALAR_MODEL
    equation: "Phi(r)=C+integral^r s Omega(s)^2 ds"
    owner: IDT
  EPICYCLIC_CONSISTENCY:
    status: EXACT_WITHIN_STATIONARY_CENTRAL_SCALAR_MODEL
    equation: "kappa_epi^2=4 Omega^2+r d(Omega^2)/dr"
    owner: IDT
  KOBS_IDENTITY:
    status: EXACT_WITHIN_STATIONARY_CENTRAL_SCALAR_MODEL
    equation: "d(r^3 Omega^2)/dr=r^2(kappa_epi^2-Omega^2)"
    owner: IDT
  KEPLER_CAMOUFLAGE:
    status: EXACT_SOURCE_NON_IDENTIFIABILITY_CLASS
    equation: "delta Phi=C0+C1/r"
    owner: IDT
    consumer: GREMLIN
  HOLONOMY_SHELL_SUSCEPTIBILITY:
    status: EXACT_AFTER_DECLARED_CIRCULATION_SHELL_BINDING
    equation: "dr/dtau=-Lambda^2 nu/(pi r^3 kappa_epi^2)"
    owner: IDT
    consumer: GREMLIN
  GRAPH_U1_GAUGE_QUOTIENT:
    status: EXACT_FINITE_GRAPH_MATHEMATICS
    equation: "[theta] in H^1(G,U(1)); beta1=E-V+C"
    owner: RC
  SPECTRAL_LINE_PHASE_SLOPE:
    status: EXACT_AFTER_DECLARED_PHASE_DEPENDENT_HAMILTONIAN
    equation: "d omega_mn/d Phi_a=-(J_m,a-J_n,a)/hbar"
    owner: RC
    consumer: OES
  SPECTRAL_IDENTIFIABILITY:
    status: EXACT_LOCAL_LINEAR_ALGEBRA_CONDITION
    equation: "rank(J_observable_phase)=beta1"
    owner: OES
  ORBIT_TO_TRANSVERSE_PHASE_CURVATURE:
    status: EXACT_WITHIN_SPHERICAL_SHARED_SCALAR_MODEL
    equation: "d2Phi/db2=(b^2/r^2)kappa^2+(1-4b^2/r^2)Omega^2"
    owner: QHTRI_OPTICS

candidate_edges:
